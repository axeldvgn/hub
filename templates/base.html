<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Le Labo — Axel Duvignon{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="hub-topbar">
    <div>
        <a class="hub-brand" href="{{ url_for('home') }}">Le Labo</a>
        <span class="hub-subbrand">par Axel Duvignon</span>
    </div>
    {% if hub_user %}
    <div class="hub-topbar-right">
        <span class="hub-topbar-user">{{ hub_user['username'] }}{% if hub_user['is_guest'] %} <span class="hub-guest-badge">Invité</span>{% endif %}</span>
        <button class="btn-ghost btn-small" id="hubLogoutBtn">Déconnexion</button>
    </div>
    {% endif %}
</header>
<main class="hub-page">
{% block content %}{% endblock %}
</main>
{% if hub_user %}
<script>
document.getElementById('hubLogoutBtn').addEventListener('click', async () => {
    await fetch('/api/logout', {method: 'POST'});
    window.location.href = '/login';
});
</script>
{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
