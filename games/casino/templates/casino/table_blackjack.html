{% extends "casino/base.html" %}
{% block title %}Casino — Blackjack {{ code }}{% endblock %}
{% block content %}
<div class="table-screen" data-code="{{ code }}" data-user-id="{{ user['id'] }}">
    <div class="table-header">
        <h1>🃏 Blackjack</h1>
        <span class="code-tag">Salon {{ code }}</span>
    </div>

    <div class="felt">
        <p class="bj-hand-label" style="text-align:center;color:var(--text-dim);font-size:12px;margin:0 0 6px;">Croupier</p>
        <div class="dealer-cards" id="dealerCards"></div>
        <p class="pot-display" id="dealerValue">Valeur : ?</p>
    </div>

    <div class="seats-row" id="seatsRow"></div>

    <div class="bet-row" id="betRow">
        <label for="betAmount">Mise</label>
        <input type="number" id="betAmount" value="50" min="10" step="10">
        <button class="btn-primary" id="placeBetBtn">Miser</button>
    </div>

    <p class="turn-banner" id="turnBanner"></p>
    <div class="action-row" id="actionRow" hidden>
        <button class="btn-outline" id="hitBtn">Tirer</button>
        <button class="btn-primary" id="standBtn">Rester</button>
    </div>

    <div style="text-align:center;margin-top:16px;">
        <button class="btn-outline" id="forceDealBtn" hidden>Forcer la distribution</button>
        <button class="btn-primary" id="nextHandBtn" hidden>Main suivante</button>
        <button class="btn-ghost btn-small" id="leaveBtn">Quitter la table</button>
    </div>
    <p class="msg" id="gameMsg"></p>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('casino.static', filename='js/blackjack.js') }}"></script>
{% endblock %}
