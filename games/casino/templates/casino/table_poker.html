{% extends "casino/base.html" %}
{% block title %}Casino — Poker {{ code }}{% endblock %}
{% block content %}
<div class="table-screen" data-code="{{ code }}" data-user-id="{{ user['id'] }}">
    <div class="table-header">
        <h1>♠️ Poker</h1>
        <span class="code-tag">Salon {{ code }}</span>
    </div>

    <div class="seats-row" id="seatsRow"></div>

    <div class="felt">
        <p class="pot-display" id="potDisplay">Pot : 0 🪙</p>
        <div class="community-cards" id="communityCards"></div>
        <p class="turn-banner" id="turnBanner"></p>
        <p class="bj-hand-label" style="text-align:center;color:var(--text-dim);font-size:12px;margin:0 0 6px;">Vos cartes</p>
        <div class="hand-cards" id="myCards"></div>
    </div>

    <div class="action-row" id="actionRow" hidden>
        <button class="btn-outline" id="foldBtn">Se coucher</button>
        <button class="btn-primary" id="callBtn">Suivre</button>
        <input type="number" id="raiseAmount" min="0" step="10">
        <button class="btn-outline" id="raiseBtn">Miser</button>
        <button class="btn-outline" id="allinBtn">Tapis</button>
    </div>

    <div id="resultPanel" class="result-panel" hidden></div>

    <div style="text-align:center;margin-top:16px;">
        <button class="btn-primary" id="nextHandBtn" hidden>Main suivante</button>
        <button class="btn-outline" id="rebuyBtn" hidden>Racheter des jetons</button>
        <button class="btn-ghost btn-small" id="leaveBtn">Quitter la table</button>
    </div>
    <p class="msg" id="pokerMsg"></p>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('casino.static', filename='js/poker.js') }}"></script>
{% endblock %}
