{% extends "casino/base.html" %}
{% block title %}Casino — Connexion{% endblock %}
{% block content %}
<div class="auth-screen">
    <div class="auth-hero">
        <div class="hero-wheel"></div>
        <h1 class="auth-title">Le Casino</h1>
        <p class="auth-tagline">Poker, roulette, blackjack, dés &amp; machines à sous — entre potes.</p>
    </div>

    <div class="auth-card">
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Connexion</button>
            <button class="auth-tab" data-tab="register">Créer un compte</button>
        </div>

        <form id="loginForm" class="auth-form">
            <label>Pseudo
                <input type="text" name="username" autocomplete="username" required>
            </label>
            <label>Mot de passe
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <p class="form-error" id="loginError"></p>
            <button type="submit" class="btn-primary btn-large">Se connecter</button>
        </form>

        <form id="registerForm" class="auth-form" hidden>
            <label>Pseudo
                <input type="text" name="username" minlength="3" autocomplete="username" required>
            </label>
            <label>Mot de passe
                <input type="password" name="password" minlength="4" autocomplete="new-password" required>
            </label>
            <p class="form-hint">Vous démarrez avec 1000 jetons.</p>
            <p class="form-error" id="registerError"></p>
            <button type="submit" class="btn-primary btn-large">Créer mon compte</button>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('casino.static', filename='js/login.js') }}"></script>
{% endblock %}
