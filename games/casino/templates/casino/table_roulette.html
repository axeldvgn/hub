{% extends "casino/base.html" %}
{% block title %}Casino — Roulette {{ code }}{% endblock %}
{% block content %}
<div class="table-screen" data-code="{{ code }}" data-user-id="{{ user['id'] }}">
    <div class="table-header">
        <h1>🎡 Roulette</h1>
        <span class="code-tag">Salon {{ code }}</span>
    </div>

    <div class="seats-row" id="seatsRow"></div>

    <p class="pot-display" id="resultDisplay">—</p>
    <p class="turn-banner" id="statusBanner"></p>

    <div class="felt">
        <div class="bet-outside" id="outsideBets">
            <button class="btn-outline" data-type="red">Rouge</button>
            <button class="btn-outline" data-type="black">Noir</button>
            <button class="btn-outline" data-type="even">Pair</button>
            <button class="btn-outline" data-type="odd">Impair</button>
            <button class="btn-outline" data-type="low">Manque 1-18</button>
            <button class="btn-outline" data-type="high">Passe 19-36</button>
        </div>
        <div class="roulette-grid" id="numberGrid"></div>
    </div>

    <div class="bet-row" id="betRow">
        <label for="betAmount">Mise</label>
        <input type="number" id="betAmount" value="50" min="10" step="10">
        <button class="btn-primary" id="placeBetBtn">Miser</button>
    </div>

    <ul class="bets-summary" id="betsSummary"></ul>

    <div style="text-align:center;margin-top:16px;">
        <button class="btn-outline" id="forceResolveBtn" hidden>Forcer le lancer</button>
        <button class="btn-primary" id="nextRoundBtn" hidden>Manche suivante</button>
        <button class="btn-ghost btn-small" id="leaveBtn">Quitter la table</button>
    </div>
    <p class="msg" id="gameMsg"></p>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('casino.static', filename='js/roulette.js') }}"></script>
{% endblock %}
